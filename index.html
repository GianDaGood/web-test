<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameHub - Gaming Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #0b0b14;
    color: white;
}

nav {
    background: #11111d;
    padding: 18px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid #2b2b40;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #a855f7;
}

.logo span {
    color: #22d3ee;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 25px;
}

nav ul li a {
    color: #ddd;
    text-decoration: none;
}

nav ul li a:hover {
    color: #a855f7;
}

.hero {
    min-height: 500px;
    display: flex;
    align-items: center;
    padding: 80px 8%;
    background: linear-gradient(90deg, #0b0b14 25%, rgba(11,11,20,.5)),
    url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1600&q=80");
    background-size: cover;
    background-position: center;
}

.hero-content {
    max-width: 600px;
}

.hero h1 {
    font-size: 60px;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #a855f7;
}

.hero p {
    color: #bbb;
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.hero button {
    padding: 14px 25px;
    background: #a855f7;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.hero button:hover {
    background: #9333ea;
}

.search-section {
    padding: 40px 8% 20px;
}

.search-section input {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #171725;
    color: white;
    font-size: 16px;
}

.categories {
    padding: 20px 8%;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.category-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #1d1d2c;
    color: white;
    cursor: pointer;
}

.category-btn:hover {
    background: #a855f7;
}

.games {
    padding: 40px 8%;
}

.games h2 {
    font-size: 32px;
    margin-bottom: 30px;
}

.game-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

.game-card {
    background: #171725;
    border-radius: 15px;
    overflow: hidden;
    transition: .3s;
    border: 1px solid #29293d;
}

.game-card:hover {
    transform: translateY(-8px);
    border-color: #a855f7;
}

.game-card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.game-info {
    padding: 18px;
}

.game-info h3 {
    margin-bottom: 10px;
}

.game-info p {
    color: #aaa;
    margin-bottom: 15px;
}

.game-info button {
    padding: 10px 15px;
    border: none;
    background: #22d3ee;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.favorite {
    float: right;
    font-size: 22px;
    cursor: pointer;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-content {
    background: #181827;
    max-width: 500px;
    width: 100%;
    border-radius: 15px;
    overflow: hidden;
}

.modal-content img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.modal-text {
    padding: 25px;
}

.close {
    float: right;
    font-size: 30px;
    cursor: pointer;
}

footer {
    background: #11111d;
    text-align: center;
    padding: 30px;
    color: #888;
    margin-top: 40px;
}

@media(max-width:700px) {

    nav ul {
        display: none;
    }

    .hero h1 {
        font-size: 40px;
    }

    .hero {
        padding: 60px 6%;
    }

    .games,
    .search-section,
    .categories {
        padding-left: 5%;
        padding-right: 5%;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">GAME<span>HUB</span></div>

    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#games">Games</a></li>
        <li><a href="#categories">Categories</a></li>
    </ul>
</nav>

<section class="hero" id="home">

    <div class="hero-content">

        <h1>Find Your Next <span>Adventure</span></h1>

        <p>
            Discover amazing games, explore different genres,
            and find your next favorite gaming experience.
        </p>

        <button onclick="document.getElementById('games').scrollIntoView()">
            Explore Games
        </button>

    </div>

</section>

<section class="search-section">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search for a game..."
        onkeyup="searchGames()"
    >

</section>

<section class="categories" id="categories">

    <button class="category-btn" onclick="filterGames('All')">All</button>
    <button class="category-btn" onclick="filterGames('Action')">Action</button>
    <button class="category-btn" onclick="filterGames('RPG')">RPG</button>
    <button class="category-btn" onclick="filterGames('Sports')">Sports</button>
    <button class="category-btn" onclick="filterGames('Adventure')">Adventure</button>
    <button class="category-btn" onclick="filterGames('Shooter')">Shooter</button>

</section>

<section class="games" id="games">

    <h2>🔥 Trending Games</h2>

    <div class="game-container" id="gameContainer"></div>

</section>

<div class="modal" id="modal">

    <div class="modal-content">

        <div class="modal-text">

            <span class="close" onclick="closeModal()">&times;</span>

            <img id="modalImage">

            <h2 id="modalTitle"></h2>

            <br>

            <p id="modalDescription"></p>

        </div>

    </div>

</div>

<footer>
    <p>© 2026 GAMEHUB | Gaming Website</p>
</footer>

<script>

const games = [

{
title: "Cyber Legends",
category: "Action",
image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80",
description: "Enter a futuristic cyber world filled with dangerous missions and powerful enemies."
},

{
title: "Shadow Realm",
category: "RPG",
image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80",
description: "Explore magical kingdoms, fight enemies and become a legendary hero."
},

{
title: "Speed Masters",
category: "Sports",
image: "https://images.unsplash.com/photo-1551698618-1dfe5d97d256?auto=format&fit=crop&w=600&q=80",
description: "Race against the best competitors and become the ultimate champion."
},

{
title: "Lost Island",
category: "Adventure",
image: "https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?auto=format&fit=crop&w=600&q=80",
description: "Explore a mysterious island filled with secrets and hidden treasures."
},

{
title: "War Zone X",
category: "Shooter",
image: "https://images.unsplash.com/photo-1542751110-97427bbecf20?auto=format&fit=crop&w=600&q=80",
description: "Fight intense battles and dominate the battlefield."
},

{
title: "Dragon Quest",
category: "RPG",
image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=600&q=80",
description: "Fight powerful dragons and save the kingdom from destruction."
},

{
title: "Street Fighter Pro",
category: "Action",
image: "https://images.unsplash.com/photo-1547394765-185e1e68f34e?auto=format&fit=crop&w=600&q=80",
description: "Master your fighting skills and defeat legendary opponents."
},

{
title: "Galaxy Explorer",
category: "Adventure",
image: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=600&q=80",
description: "Travel across the galaxy and discover new planets."
}

];

function displayGames(gameList) {

    const container = document.getElementById("gameContainer");

    container.innerHTML = "";

    if(gameList.length === 0) {

        container.innerHTML = "<p>No games found.</p>";

        return;
    }

    gameList.forEach((game, index) => {

        container.innerHTML += `

        <div class="game-card">

            <img src="${game.image}">

            <div class="game-info">

                <h3>${game.title}</h3>

                <p>${game.category}</p>

                <button onclick="showDetails(${index})">
                    View Details
                </button>

            </div>

        </div>

        `;

    });

}

function searchGames() {

    const searchValue =
    document.getElementById("search").value.toLowerCase();

    const filteredGames = games.filter(game =>
        game.title.toLowerCase().includes(searchValue)
    );

    displayGames(filteredGames);

}

function filterGames(category) {

    if(category === "All") {

        displayGames(games);

    } else {

        const filteredGames = games.filter(game =>
            game.category === category
        );

        displayGames(filteredGames);

    }

}

function showDetails(index) {

    const game = games[index];

    document.getElementById("modalImage").src = game.image;

    document.getElementById("modalTitle").innerText = game.title;

    document.getElementById("modalDescription").innerText =
    game.description;

    document.getElementById("modal").style.display = "flex";

}

function closeModal() {

    document.getElementById("modal").style.display = "none";

}

window.onclick = function(event) {

    const modal = document.getElementById("modal");

    if(event.target === modal) {

        modal.style.display = "none";

    }

}

displayGames(games);

</script>

</body>
</html>
